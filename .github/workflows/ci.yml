name: CCHIA Security Compiler CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: seguridad-ia-cchia/requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r seguridad-ia-cchia/requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q seguridad-ia-cchia/cchia_engine seguridad-ia-cchia/scripts seguridad-ia-cchia/tests

      - name: Validate CCHIA Check catalog
        run: python seguridad-ia-cchia/scripts/cchia.py validate

      - name: Run test suite
        run: python -m unittest discover -s seguridad-ia-cchia/tests -v
