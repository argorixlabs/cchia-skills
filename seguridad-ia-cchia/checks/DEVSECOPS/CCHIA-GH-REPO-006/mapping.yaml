schema_version: "1.0"
control_id: CCHIA-GH-REPO-006
frameworks:
  nist:
    - id: NIST-SP-800-53r5.1-CM-5
      type: conceptual
      rationale: Restricciones de acceso para cambio respaldan enforcement sobre cambios al repositorio.
    - id: NIST-SP-800-53r5.1-AC-6
      type: conceptual
      rationale: Least Privilege respalda permisos read por defecto para el token de workflows.
  iso:
    - id: ISO/IEC-27001:2022
      type: conceptual
      rationale: Alineación general con control de cambios, privilegios y desarrollo seguro; confirmar controles exactos contra copia licenciada.
  cchia:
    - id: CCHIA-GH-REPO-006
      type: native
      rationale: Evaluación read-only de metadata, rulesets y defaults de GitHub Actions.
  github:
    - id: GitHub-Repository-Rulesets
      type: direct
      rationale: GitHub documenta rulesets y reglas de pull request para proteger ramas y exigir aprobaciones.
    - id: GitHub-Actions-Workflow-Permissions
      type: direct
      rationale: GitHub expone los permisos por defecto del GITHUB_TOKEN y si Actions puede aprobar pull requests.
