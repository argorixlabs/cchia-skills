schema_version: "1.0"
control_id: CCHIA-K8S-RBAC-002
frameworks:
  nist:
    - id: NIST-SP-800-53r5.1-AC-6
      type: conceptual
      rationale: Least Privilege respalda restringir privilegios administrativos, wildcards y capacidades de escalación.
  iso:
    - id: ISO/IEC-27001:2022
      type: conceptual
      rationale: Alineación general con control de acceso y privilegios; confirmar controles exactos contra copia licenciada.
  cchia:
    - id: CCHIA-K8S-RBAC-002
      type: native
      rationale: Evaluación runtime read-only de objetos Role, ClusterRole y sus bindings.
  kubernetes:
    - id: Kubernetes-RBAC-Good-Practices
      type: direct
      rationale: Kubernetes recomienda least privilege, evitar wildcards y minimizar distribución de privilegios.
