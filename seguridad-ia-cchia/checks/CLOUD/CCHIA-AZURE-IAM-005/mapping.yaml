schema_version: "1.0"
control_id: CCHIA-AZURE-IAM-005
frameworks:
  nist:
    - id: NIST-CSF-2.0-PR.AA-05
      type: direct
      rationale: El check observa asignaciones RBAC que contradicen mínimo privilegio o presentan principals anómalos en el snapshot consultado.
    - id: NIST-SP-800-53r5.1-AC-6
      type: direct
      rationale: La detección de Owner y User Access Administrator en scopes amplios aporta evidencia técnica puntual sobre privilegios excesivos.
  iso:
    - id: ISO/IEC-27001:2022
      type: conceptual
      rationale: Alineación conceptual con control de acceso y privilegios; no declara conformidad ni reproduce requisitos protegidos.
  cchia:
    - id: CCHIA-AZURE-IAM-005
      type: native
      rationale: Evidencia runtime redacted de Azure RBAC obtenida mediante comandos Azure CLI allow-listed.
