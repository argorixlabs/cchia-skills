schema_version: "1.0"
control_id: CCHIA-AWS-IAM-004
frameworks:
  nist:
    - id: NIST-CSF-2.0-PR.AA-03
      type: conceptual
      rationale: El indicador MFA del root user aporta evidencia puntual sobre autenticación reforzada para una identidad privilegiada.
    - id: NIST-CSF-2.0-PR.AA-05
      type: direct
      rationale: AdministratorAccess y acciones wildcard contradicen una autorización acotada y revisable en el snapshot observado.
    - id: NIST-SP-800-53r5.1-AC-6
      type: direct
      rationale: La detección de grants administrativos y wildcard aporta evidencia técnica puntual sobre mínimo privilegio.
  iso:
    - id: ISO/IEC-27001:2022
      type: conceptual
      rationale: Alineación conceptual con autenticación, control de acceso y privilegios; confirmar controles exactos contra una copia licenciada.
  cchia:
    - id: CCHIA-AWS-IAM-004
      type: native
      rationale: Evaluación runtime redacted del root user y las autorizaciones IAM enumeradas por aws-iam.
  aws:
    - id: AWS-IAM-root-user-best-practices
      type: direct
      rationale: AWS recomienda MFA para el root user y no crear access keys root salvo necesidad excepcional.
    - id: AWS-IAM-least-privilege
      type: direct
      rationale: Las políticas AdministratorAccess y acciones wildcard son patrones incompatibles con permisos mínimos en la mayoría de los usos.
