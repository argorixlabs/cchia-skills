schema_version: "1.0"
control_id: CCHIA-GCP-IAM-003
frameworks:
  nist:
    - id: NIST-CSF-2.0-PR.AA-05
      type: direct
      rationale: El check observa si autorizaciones efectivas del proyecto contradicen mínimo privilegio mediante roles básicos o membresía pública.
    - id: NIST-SP-800-53r5.1-AC-6
      type: direct
      rationale: La detección de roles básicos y principals públicos aporta evidencia técnica puntual sobre privilegios excesivos.
  iso:
    - id: ISO/IEC-27001:2022
      type: conceptual
      rationale: Alineación conceptual con control de acceso y privilegios; el resultado no prueba conformidad y los controles exactos deben confirmarse contra una copia licenciada.
  cchia:
    - id: CCHIA-GCP-IAM-003
      type: native
      rationale: Evidencia runtime redacted de IAM efectivo del proyecto consultado por gcloud-iam.
  cis:
    - id: CIS-Google-Cloud-Platform-Foundation-Benchmark
      type: conceptual
      rationale: Los benchmarks GCP incluyen recomendaciones IAM; la versión y sección aplicable deben verificarse separadamente.
sources:
  - title: NIST SP 800-53 Revision 5.1 derived OSCAL publication
    url: https://csrc.nist.gov/CSRC/media/Projects/risk-management/800-53%20Downloads/800-53r5/SP_800-53_v5_1-derived-OSCAL.pdf
    verified: "2026-08-07"
  - title: NIST Cybersecurity Framework 2.0
    url: https://www.nist.gov/publications/nist-cybersecurity-framework-csf-20
    verified: "2026-08-07"
  - title: Google Cloud IAM basic and predefined roles
    url: https://cloud.google.com/iam/docs/roles-overview
    verified: "2026-08-07"
  - title: ISO/IEC 27001:2022
    url: https://www.iso.org/standard/27001
    verified: "2026-08-07"
